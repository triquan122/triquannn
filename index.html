<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quest - Millionaire Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header Styles */
        .header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(0, 255, 255, 0.2);
        }

        .game-title {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00f5ff, #a855f7, #00f5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .stats-container {
            display: flex;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .stat-label {
            font-size: 0.9em;
            color: #00f5ff;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        /* Main Container */
        .main-container {
            display: flex;
            justify-content: center;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Game Container */
        .game-container {
            flex: 1;
            max-width: 900px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 2px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .question-number {
            color: #a855f7;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #00f5ff;
            font-weight: 600;
        }

        .question-example {
            font-size: 1em;
            color: #ccc;
            font-style: italic;
            margin-bottom: 20px;
        }

        .timer-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #ffbe0b);
            transition: width 0.1s linear;
        }

        /* Answer Options */
        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 255, 0.3);
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            text-align: left;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .answer-btn:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00f5ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
        }

        .answer-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .answer-btn:active {
            transform: translateY(-1px);
        }

        .answer-btn.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
            animation: correct-flash 0.5s ease;
        }

        .answer-btn.wrong {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        @keyframes correct-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Feedback */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .feedback-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            border: 2px solid rgba(0, 255, 255, 0.3);
        }

        .feedback-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .feedback-title {
            font-size: 2em;
            margin-bottom: 15px;
            color: #00f5ff;
        }

        .feedback-text {
            font-size: 1.1em;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .continue-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none;
            color: #fff;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }

        /* Start Screen */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .start-content {
            text-align: center;
            padding: 40px;
        }

        .start-title {
            font-size: 4em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00f5ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-subtitle {
            font-size: 1.5em;
            color: #ccc;
            margin-bottom: 40px;
        }

        .start-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none;
            color: #fff;
            padding: 20px 60px;
            border-radius: 15px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 255, 255, 0.5);
        }

        /* Particles Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00f5ff;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 6s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title {
                font-size: 1.8em;
            }
            .question-text {
                font-size: 1.3em;
            }
            .start-title {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Particles Background -->
    <div class="particles" id="particles"></div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <h1 class="start-title">🎮 TEST</h1>
            <p class="start-subtitle">Kiểm tra từ vựng</p>
            <button class="start-btn" onclick="startGame()">BẮT ĐẦU</button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <h1 class="game-title">💰 TEST</h1>
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-label">Câu hỏi hiện tại</div>
                <div class="stat-value" id="currentLevel">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Tổng điểm</div>
                <div class="stat-value" id="totalScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Lần chơi tốt nhất</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Game Container -->
        <main class="game-container">
            <div class="question-card" id="questionCard">
                <div class="question-number" id="questionNumber">Câu hỏi 1</div>
                <div class="question-text" id="questionText">Loading...</div>
                <div class="question-example" id="questionExample"></div>
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill" style="width: 100%"></div>
                </div>
                <div class="answers-grid" id="answersGrid"></div>
            </div>
        </main>
    </div>

    <!-- Feedback Overlay -->
    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-card">
            <div class="feedback-icon" id="feedbackIcon">✅</div>
            <div class="feedback-title" id="feedbackTitle">Chính xác!</div>
            <div class="feedback-text" id="feedbackText"></div>
            <button class="continue-btn" onclick="handleFeedbackAction()">Tiếp tục</button>
        </div>
    </div>

    <script>
        // ==================== GAME DATA ====================
        const vocabulary = [
            { word: "object", meaning: "vật thể" },
{ word: "observe", meaning: "quan sát" },
{ word: "occur", meaning: "xảy ra" },
{ word: "ocean", meaning: "đại dương" },
{ word: "offer", meaning: "biếu" },
{ word: "office", meaning: "cơ quan" },
{ word: "office", meaning: "văn phòng," },
{ word: "operate", meaning: "điều khiển" },
{ word: "opposite", meaning: "ngược nhau" },
{ word: "original", meaning: "nguồn gốc" },
{ word: "over", meaning: "trên" },
{ word: "lay", meaning: "xếp" },
{ word: "least", meaning: "tối thiểu" },
{ word: "length", meaning: "chiều dài" },
{ word: "let", meaning: "để cho" },
{ word: "letter", meaning: "thư" },
{ word: "lie", meaning: "nói dối" },
{ word: "lift", meaning: "giơ lên" },
{ word: "liquid", meaning: "chất lỏng" },
{ word: "locate", meaning: "định vị" },
{ word: "lone", meaning: "hiu quạnh" },
{ word: "lot", meaning: "việc rút thăm" },
{ word: "loud", meaning: "ầm ĩ" },
{ word: "low", meaning: "thấp" },
{ word: "race", meaning: "loài" },
{ word: "rail", meaning: "đường ray" },
{ word: "rain", meaning: "mưa" },
{ word: "raise", meaning: "nâng lên" },
{ word: "ran", meaning: "Chạy" },
{ word: "range", meaning: "dãy" },
{ word: "rather", meaning: "thà.. còn hơn" },
{ word: "reach", meaning: "đến" },
{ word: "reason", meaning: "lý do" },
{ word: "receive", meaning: "nhận" },
{ word: "region", meaning: "vùng" },
{ word: "remember", meaning: "nhớ lại" },
{ word: "repeat", meaning: "lặp lại" },
{ word:  "represent", meaning: "miêu tả" },
{ word: "require", meaning: "đòi hỏi" },
{ word: "rest", meaning: "sự nghỉ ngơi" },
{ word: "result ", meaning: "kết quả" },
{ word: "ride", meaning: "cưỡi" },
{ word: "right", meaning: "phải" },
{ word: "ring", meaning: "chiếc nhẫn" },
{ word: "rise", meaning: "thăng cấp" },
{ word: "river", meaning: "sông" },
{ word: "rock", meaning: "đá" },
{ word: "roll", meaning: "cuộn" },
{ word: "root", meaning: "gốc" },
{ word: "rope", meaning: "dây cáp" },
{ word: "rose", meaning: "hoa hồng" },
{ word: "round", meaning: "vòng quanh" },
{ word: "row", meaning: "hàng" },
{ word: "rub", meaning: "xoa bóp" },
{ word: "rule", meaning: "quy tắc" },
{ word: "tail", meaning: "đuôi" },
  { word: "tall", meaning: "cao" },
  { word: "teeth", meaning: "răng (số nhiều của tooth)" },
  { word: "temperature", meaning: "nhiệt độ" },
  { word: "term", meaning: "thuật ngữ; học kỳ; thời hạn" },
  { word: "than", meaning: "hơn (dùng trong so sánh)" },
  { word: "their", meaning: "của họ" },
  { word: "them", meaning: "họ (tân ngữ)" },
  { word: "then", meaning: "sau đó; lúc đó" },
  { word: "there", meaning: "ở đó; có (there is/are)" },
  { word: "these", meaning: "những cái này" },
  { word: "they", meaning: "họ (chủ ngữ)" },
  { word: "thick", meaning: "dày; đặc" },
  { word: "thin", meaning: "mỏng; gầy" },
  { word: "thing", meaning: "vật; thứ" },
  { word: "third", meaning: "thứ ba" },
  { word: "those", meaning: "những cái kia" },
  { word: "though", meaning: "mặc dù" },
  { word: "too", meaning: "quá; cũng" },
  { word: "tool", meaning: "công cụ" },
  { word: "total", meaning: "tổng; toàn bộ" },
  { word: "toward", meaning: "về phía; hướng tới" },
  { word: "track", meaning: "đường ray; theo dõi" },
  { word: "trade", meaning: "buôn bán; thương mại" },
  { word: "train", meaning: "tàu hỏa; huấn luyện" },
  { word: "tree", meaning: "cây" },
  { word: "triangle", meaning: "hình tam giác" },
  { word: "trip", meaning: "chuyến đi" },
  { word: "trouble", meaning: "rắc rối; vấn đề" },
  { word: "truck", meaning: "xe tải" },
  { word: "tube", meaning: "ống; tuýp" },
  { word: "type", meaning: "loại; kiểu; đánh máy" }




        ];

        // ==================== GAME STATE ====================
        let gameState = {
            currentLevel: 1,
            totalScore: 0,
            bestScore: 0,
            currentQuestion: null,
            usedQuestions: [],
            timer: null,
            timeLeft: 30,
            isWrong: false
        };

        // Load saved game state
        function loadGameState() {
            const saved = localStorage.getItem('englishMillionaireSave');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.bestScore = data.bestScore || 0;
            }
        }

        // Save game state
        function saveGameState() {
            const toSave = {
                bestScore: gameState.bestScore
            };
            localStorage.setItem('englishMillionaireSave', JSON.stringify(toSave));
        }

        // ==================== INITIALIZE ====================
        function init() {
            createParticles();
            loadGameState();
            updateUI();
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                container.appendChild(particle);
            }
        }

        // Hàm xáo trộn mảng
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // ==================== GAME FLOW ====================
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            resetGame();
            loadQuestion();
        }

        function resetGame() {
            gameState.currentLevel = 1;
            gameState.totalScore = 0;
            gameState.usedQuestions = [];
            gameState.isWrong = false;
            updateUI();
        }

        function loadQuestion() {
            // Lấy các từ chưa dùng
            const availableWords = vocabulary.filter(v => !gameState.usedQuestions.includes(v.word));
            
            // Nếu đã hết từ, reset lại
            if (availableWords.length === 0) {
                gameState.usedQuestions = [];
                availableWords.push(...vocabulary);
            }

            // Random một từ bất kỳ
            const question = availableWords[Math.floor(Math.random() * availableWords.length)];
            gameState.currentQuestion = question;
            gameState.usedQuestions.push(question.word);

            // Tạo 3 đáp án sai ngẫu nhiên
            const wrongAnswers = shuffleArray(vocabulary)
                .filter(v => v.word !== question.word)
                .slice(0, 3)
                .map(v => v.meaning);

            const answers = shuffleArray([...wrongAnswers, question.meaning]);

            document.getElementById('questionNumber').textContent = `Câu hỏi ${gameState.currentLevel}`;
            document.getElementById('questionText').textContent = question.word;
            document.getElementById('questionExample').textContent = question.example ? `"${question.example}"` : '';

            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';
            answers.forEach(answer => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.onclick = () => checkAnswer(answer);
                grid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            gameState.timeLeft = 30;
            const timerFill = document.getElementById('timerFill');
            
            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                gameState.timeLeft -= 0.1;
                const percentage = (gameState.timeLeft / 30) * 100;
                timerFill.style.width = percentage + '%';

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    checkAnswer(null); // Hết giờ
                }
            }, 100);
        }

        function checkAnswer(answer) {
            clearInterval(gameState.timer);
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.onclick = null);

            const correct = answer === gameState.currentQuestion.meaning;

            if (correct) {
                // Highlight correct button
                buttons.forEach(btn => {
                    if (btn.textContent === answer) {
                        btn.classList.add('correct');
                    }
                });

                // Add score (100 điểm mỗi câu đúng)
                const reward = 100;
                gameState.totalScore += reward;

                setTimeout(() => {
                    showFeedback(
                        '✅',
                        'Chính xác!',
                        `+${reward} điểm\n"${gameState.currentQuestion.word}" nghĩa là "${gameState.currentQuestion.meaning}"`
                    );
                }, 500);

            } else {
                // Highlight correct and wrong answers
                buttons.forEach(btn => {
                    if (btn.textContent === gameState.currentQuestion.meaning) {
                        btn.classList.add('correct');
                    } else if (btn.textContent === answer || answer === null) {
                        btn.classList.add('wrong');
                    }
                });

                gameState.isWrong = true;

                setTimeout(() => {
                    showFeedback(
                        '❌',
                        'Trả lời sai!',
                        `Đáp án đúng: "${gameState.currentQuestion.meaning}"\n\nTổng điểm của bạn: ${gameState.totalScore} điểm\n\n"${gameState.currentQuestion.word}" - ${gameState.currentQuestion.meaning}${gameState.currentQuestion.example ? '\nVí dụ: ' + gameState.currentQuestion.example : ''}`
                    );
                }, 500);
            }

            // Update best score
            if (gameState.totalScore > gameState.bestScore) {
                gameState.bestScore = gameState.totalScore;
                saveGameState();
            }

            updateUI();
        }

        function showFeedback(icon, title, text) {
            document.getElementById('feedbackIcon').textContent = icon;
            document.getElementById('feedbackTitle').textContent = title;
            document.getElementById('feedbackText').textContent = text;
            document.getElementById('feedbackOverlay').style.display = 'flex';
        }

        function handleFeedbackAction() {
            document.getElementById('feedbackOverlay').style.display = 'none';
            
            if (gameState.isWrong) {
                // Game over – quay lại màn hình bắt đầu
                document.getElementById('startScreen').style.display = 'flex';
                resetGame();
            } else {
                // Sang câu tiếp theo
                gameState.currentLevel++;
                loadQuestion();
            }
        }

        function updateUI() {
            document.getElementById('currentLevel').textContent = gameState.currentLevel;
            document.getElementById('totalScore').textContent = gameState.totalScore.toLocaleString();
            document.getElementById('bestScore').textContent = gameState.bestScore.toLocaleString();
        }

        // ==================== START GAME ====================
        init();
    </script>
</body>
</html>
